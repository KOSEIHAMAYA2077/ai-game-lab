name: Publish playable prototype

on:
  push:
    branches: [main]
    paths: [.github/workflows/playable-pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playable-pages
  cancel-in-progress: false

env:
  PLAYABLE_REF: glyph-creature-p0-v0.11.0-rigs.1
  SKELETON_REF: glyph-matter-v0.12.0-skeleton.1
  PROGRAM_REF: glyph-matter-v0.13.0-program.1
  TWIST_REF: glyph-matter-v0.13.1-twist.1
  WIDGET_REF: glyph-matter-v0.14.0-widget.1
  WIDGET_BUDGET_REF: glyph-matter-v0.14.1-widget.2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the preserved playable version
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.PLAYABLE_REF }}
          path: prototype-source
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        working-directory: prototype-source/prototypes/glyph-creature
        run: npm ci --ignore-scripts
      - name: Check the prototype
        working-directory: prototype-source/prototypes/glyph-creature
        run: npm test
      - name: Build the playable files
        working-directory: prototype-source/prototypes/glyph-creature
        run: npm run build
      - name: Record the published version
        working-directory: prototype-source/prototypes/glyph-creature
        run: |
          SOURCE_SHA=$(git rev-parse HEAD) node -e 'const fs = require("node:fs"); const pkg = require("./package.json"); fs.writeFileSync("dist/version.json", JSON.stringify({ version: pkg.version, ref: process.env.PLAYABLE_REF, commit: process.env.SOURCE_SHA }, null, 2) + "\n");'
      - name: Check out the separate skeleton comparison
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SKELETON_REF }}
          path: skeleton-source
          persist-credentials: false
      - name: Check and build the separate comparison
        working-directory: skeleton-source/prototypes/glyph-creature
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          SOURCE_SHA=$(git rev-parse HEAD) node -e 'const fs = require("node:fs"); const pkg = require("./package.json"); fs.writeFileSync("dist/version.json", JSON.stringify({ version: pkg.version, ref: process.env.SKELETON_REF, commit: process.env.SOURCE_SHA, model: "local browser WASM, optional first-time official model download" }, null, 2) + "\n");'
      - name: Add comparison without replacing the preserved root app
        run: |
          mkdir -p prototype-source/prototypes/glyph-creature/dist/skeleton-v1
          cp -R skeleton-source/prototypes/glyph-creature/dist/. prototype-source/prototypes/glyph-creature/dist/skeleton-v1/
          cp skeleton-source/prototypes/glyph-creature/dist/skeleton.html prototype-source/prototypes/glyph-creature/dist/skeleton-v1/index.html
      - name: Check out the separate part-program comparison
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.PROGRAM_REF }}
          path: program-source
          persist-credentials: false
      - name: Check and build the part-program comparison
        working-directory: program-source/prototypes/glyph-creature
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          SOURCE_SHA=$(git rev-parse HEAD) node -e 'const fs = require("node:fs"); const pkg = require("./package.json"); fs.writeFileSync("dist/version.json", JSON.stringify({ version: pkg.version, ref: process.env.PROGRAM_REF, commit: process.env.SOURCE_SHA, model: "local browser MiniLM plus learned relation head, bounded two-part surface compiler" }, null, 2) + "\n");'
      - name: Add part-program comparison while retaining both previous apps
        run: |
          mkdir -p prototype-source/prototypes/glyph-creature/dist/program-v1
          cp -R program-source/prototypes/glyph-creature/dist/. prototype-source/prototypes/glyph-creature/dist/program-v1/
          cp program-source/prototypes/glyph-creature/dist/program.html prototype-source/prototypes/glyph-creature/dist/program-v1/index.html
      - name: Check out the physical-section comparison
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TWIST_REF }}
          path: twist-source
          persist-credentials: false
      - name: Check and build the physical-section comparison
        working-directory: twist-source/prototypes/glyph-creature
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          SOURCE_SHA=$(git rev-parse HEAD) node -e 'const fs = require("node:fs"); const pkg = require("./package.json"); fs.writeFileSync("dist/version.json", JSON.stringify({ version: pkg.version, ref: process.env.TWIST_REF, commit: process.env.SOURCE_SHA, model: "local MiniLM plus unchanged learned head; color-independent relation and physical section twist" }, null, 2) + "\n");'
      - name: Add physical-section comparison without replacing previous apps
        run: |
          mkdir -p prototype-source/prototypes/glyph-creature/dist/twist-v1
          cp -R twist-source/prototypes/glyph-creature/dist/. prototype-source/prototypes/glyph-creature/dist/twist-v1/
          cp twist-source/prototypes/glyph-creature/dist/program.html prototype-source/prototypes/glyph-creature/dist/twist-v1/index.html
      - name: Check out the small-window comparison
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.WIDGET_REF }}
          path: widget-source
          persist-credentials: false
      - name: Check and build the small-window comparison
        working-directory: widget-source/prototypes/glyph-creature
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          SOURCE_SHA=$(git rev-parse HEAD) node -e 'const fs = require("node:fs"); const pkg = require("./package.json"); fs.writeFileSync("dist/version.json", JSON.stringify({ version: pkg.version, ref: process.env.WIDGET_REF, commit: process.env.SOURCE_SHA, model: "optional local MiniLM worker released after interpretation; paced rendering and native lifecycle" }, null, 2) + "\n");'
      - name: Add small-window comparison while preserving the four previous apps
        run: |
          mkdir -p prototype-source/prototypes/glyph-creature/dist/widget-v1
          cp -R widget-source/prototypes/glyph-creature/dist/. prototype-source/prototypes/glyph-creature/dist/widget-v1/
          cp widget-source/prototypes/glyph-creature/dist/widget.html prototype-source/prototypes/glyph-creature/dist/widget-v1/index.html
      - name: Check out the separate renderer-budget comparison
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.WIDGET_BUDGET_REF }}
          path: widget-budget-source
          persist-credentials: false
      - name: Check and build the renderer-budget comparison
        working-directory: widget-budget-source/prototypes/glyph-creature
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          SOURCE_SHA=$(git rev-parse HEAD) node -e 'const fs = require("node:fs"); const pkg = require("./package.json"); fs.writeFileSync("dist/version.json", JSON.stringify({ version: pkg.version, ref: process.env.WIDGET_BUDGET_REF, commit: process.env.SOURCE_SHA, model: "optional local MiniLM; bounded renderer buffers; raw text retained; tiny classifier evaluated separately" }, null, 2) + "\n");'
      - name: Add renderer-budget comparison without replacing the five previous apps
        run: |
          mkdir -p prototype-source/prototypes/glyph-creature/dist/widget-v2
          cp -R widget-budget-source/prototypes/glyph-creature/dist/. prototype-source/prototypes/glyph-creature/dist/widget-v2/
          cp widget-budget-source/prototypes/glyph-creature/dist/widget.html prototype-source/prototypes/glyph-creature/dist/widget-v2/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload only built public files
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: prototype-source/prototypes/glyph-creature/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
